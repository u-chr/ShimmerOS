<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>Shimmer OS</Name>
    <Username>Shimmer OS</Username>
    <ShortDescription>dsc.gg/ShimmerOS</ShortDescription>
    <Title>Shimmer OS Playbook</Title>
    <Description>dsc.gg/ShimmerOS</Description>
	<Version>1.5.1</Version>
        <UpgradableFrom>any</UpgradableFrom>
	<SupportedBuilds>
		<string>19042</string>
		<string>19044</string>
		<string>19045</string>
		<string>22000</string>
		<string>22621</string>
		<string>22631</string>
		<string>26100</string>
		<string>26200</string>
	</SupportedBuilds>
	<Requirements>
		<Requirement>DefenderDisabled</Requirement>
		<Requirement>NoAntivirus</Requirement>
		<Requirement>Internet</Requirement>
	</Requirements>
	<UseKernelDriver>false</UseKernelDriver>
	<Website>https://dsc.gg/shimmeros</Website>
    <FeaturePages>
        <CheckboxPage Description="Please select which features you would like to include or exclude with this Playbook">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Disable Power Saving</Text>
                    <Name>disable-power-saving</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Disable Mitigations</Text>
                    <Name>disable-mitigations</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Disable UAC</Text>
                    <Name>disable-uac</Name>
                </CheckboxOption>
            </Options>
		</CheckboxPage>
    </FeaturePages>
</Playbook>