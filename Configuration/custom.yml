actions:
  - !writeStatus: {status: 'Suitability Check'}
  - !powerShell:
      wait: true
      command: |
        Add-Type -AssemblyName SYSTEM.Windows.Forms -ErrorAction SilentlyContinue
        $title    = 'Playbook Error'
        $stockMsg = 'ShimmerOS cannot be installed on OEM installs nor on other custom OSes. Please try again on a stock Windows installation.'
        $msAccMsg = 'ShimmerOS cannot be installed on a Microsoft account. Please try again after switching to a local account.'
        if (Test-Path -LiteralPath 'C:\Shimmer') {
          $global:LASTEXITCODE = 0
          exit 0
        }
        function Show-Error {
          param([string]$Message)
          Stop-Process -Name 'AME Beta' -Force -ErrorAction SilentlyContinue
          [SYSTEM.Windows.Forms.MessageBox]::Show(
            $Message, $title,
            [SYSTEM.Windows.Forms.MessageBoxButtons]::OK,
            [SYSTEM.Windows.Forms.MessageBoxIcon]::Error,
            [SYSTEM.Windows.Forms.MessageBoxDefaultButton]::Button1,
            [SYSTEM.Windows.Forms.MessageBoxOptions]::DefaultDesktopOnly
          ) | Out-Null
          $global:LASTEXITCODE = 1
          exit 1
        }
        $oem = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation' -ErrorAction SilentlyContinue
        if ($oem) {
          foreach ($field in @('Manufacturer', 'Model', 'SupportURL')) {
            if (([string]$oem.$field).Trim().Length -gt 0) {
              Show-Error $stockMsg
            }
          }
        }
        if ((Get-LocalUser $env:USERNAME).PrincipalSource -ne 'Local') {
          Show-Error $msAccMsg
        }
        $global:LASTEXITCODE = 0

  - !writeStatus: {status: 'Preparation'}

  - !file: {path: 'C:\Shimmer'}
  - !cmd: {exeDir: true, command: 'xcopy "Windows" "%windir%" /E /I /Y'}
  - !cmd: {exeDir: true, command: 'move /y "Shimmer" "%systemdrive%\Shimmer"'}
  - !cmd: {exeDir: true, command: 'copy /y "hosts" "%WINDIR%\System32\drivers\etc\hosts"'}

  # Backup services
  - !powerShell:
    exeDir: true
    wait: true
    command: |
      $path = Join-Path ([Environment]::GetFolderPath('Windows')) "ServicesBackup\DefaultServices.reg"
      if (-not (Test-Path -Path $path -PathType Leaf)) {
          .\backup.ps1 -FilePath $path
      }
   
  # Disable UAC
  - !service: {name: 'luafv', operation: change, startup: 4}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'EnableLUA', type: REG_DWORD, data: '0', option: "disable-uac"}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'PromptOnSecureDesktop', type: REG_DWORD, data: '0', option: "disable-uac"}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'ConsentPromptBehaviorAdmin', type: REG_DWORD, data: '0', option: "disable-uac"}
  - !powerShell: {command: 'C:\Shimmer\Temp\set-state.ps1 -Set UAC=0', runas: currentUserElevated, option: "disable-uac", wait: true}
  
  # Download Software
  - !status: {status: 'Downloading VCRedist'}
  - !download: {git: 'https://github.com/abbodi1406/vcredist', regex: '^VisualCppRedist_AIO_x86_x64\.exe$', destination: '%temp%\vcredist.exe', overwrite: true}
  - !status: {status: 'Installing VCRedist'}
  - !cmd: {command: '"%temp%\vcredist.exe" /ai /gm2', runas: currentUserElevated, wait: true}

  - !status: {status: 'Downloading DirectX'}
  - !download: {url: 'https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe', destination: '%temp%\DirectX.exe', overwrite: true}
  - !status: {status: 'Installing DirectX'}
  - !cmd: {command: '"%temp%\DirectX.exe" /Q /C /T:%temp%\DirectX', runas: currentUserElevated, wait: true}
  - !cmd: {command: '"%temp%\DirectX\DXSETUP.exe" /silent', runas: currentUserElevated, wait: true}
  - !file: {path: '%temp%\DirectX'}

  - !status: {status: 'Downloading 7-Zip'}
  - !download: {git: 'https://github.com/ip7z/7zip', regex: '^7z.*-x64\.exe$', destination: '%temp%\7Zip.exe', overwrite: true}
  - !status: {status: 'Installing 7-Zip'}
  - !cmd: {command: '"%temp%\7Zip.exe" /S', runas: currentUserElevated, wait: true}
  
  - !status: {status: 'Downloading Shimmer Software'}
  - !download: {url: 'https://github.com/loplxl/ShimmerOS/releases/latest/download/Shimmer.zip', destination: '%temp%\Shimmer.zip', overwrite: true}
  - !status: {status: 'Installing Shimmer Software'}
  - !cmd: {command: 'powershell -Command "Expand-Archive -Path \"%temp%\Shimmer.zip\" -DestinationPath \"%temp%\extracted\" -Force"', runas: currentUserElevated, wait: true}
  - !cmd: {command: 'if not exist "C:\Shimmer\Software" mkdir "C:\Shimmer\Software"', runas: currentUserElevated, wait: true}
  - !cmd: {command: 'xcopy "%temp%\extracted\*" "C:\Shimmer" /E /H /Y', runas: currentUserElevated, wait: true}
  - !file: {path: '%temp%\Shimmer.zip'}
  - !file: {path: '%temp%\extracted'}
  
  
  # Configure Powershell 
  - !writeStatus: {status: 'Configuring Powershell'}
  - !cmd: {command: 'setx POWERSHELL_TELEMETRY_OPTOUT 1'}
  - !powerShell: {command: 'Set-ExecutionPolicy -ExecutionPolicy Unrestricted -Force'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging', value: 'EnableModuleLogging', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging', value: 'EnableScriptBlockLogging', type: REG_DWORD, data: '0'}

  # Remove OneDrive
  - !writeStatus: {status: 'Removing OneDrive'}
  - !run: {exeDir: true, exe: 'onedrive.bat', runas: currentUserElevated}  
  
