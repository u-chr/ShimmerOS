       foreach ($t in 'CDPUserSvc','AarSvc','CloudBackupRestoreSvc','PimIndexMaintenanceSvc') {
           Set-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Services\$t" Start 4 -EA 0
           Get-ChildItem "HKLM:\SYSTEM\CurrentControlSet\Services" -EA 0 |
               Where-Object { $_.PSChildName -like ($t + '_*') } |
               ForEach-Object { Set-ItemProperty $_.PSPath Start 4 -EA 0 }
